services:
  db:
    image: postgres:16
    container_name: support-link-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_link
    ports:
      - "5432:5432"
    volumes:
      - support_link_pg:/var/lib/postgresql/data

volumes:
  support_link_pg:
